name: Verify student attribution ledgers

# Runs when there is something to grade, not on a tight schedule.
#
# This used to fire every six hours. That existed to build a trail of observed
# commit SHAs, so a later force-push had an earlier observation to contradict.
# The plugin now streams its ledger records to the site as the student works, so
# the server holds a copy a force-push cannot reach and there is nothing left
# for repeated cloning to protect against.
#
# The daily run is a catch-up for submissions that arrived while nothing
# triggered a run. The queue skips repos already verified at their current head,
# so a day with no new submissions costs one API call.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [verify-attribution]

# One run at a time. Two workers verifying the same repo would clone it twice
# and write two rows saying the same thing.
concurrency:
  group: verify-attribution
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies to install: the plugin and the worker are stdlib only.
      - name: Verify
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          ATTRIBUTION_ADMIN_KEY: ${{ secrets.ATTRIBUTION_ADMIN_KEY }}
        run: python3 worker/verify_worker.py
